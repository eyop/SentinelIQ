name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sentineliq
          POSTGRES_PASSWORD: sentineliq
          POSTGRES_DB: sentineliq
        ports: [ 5432:5432 ]
        options: >-
          --health-cmd "pg_isready -U sentineliq -d sentineliq" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://sentineliq:sentineliq@localhost:5432/sentineliq
        run: pytest -q

  build-containers:
    runs-on: ubuntu-latest
    needs: test-backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry with CR_PAT
        if: ${{ secrets.CR_PAT != '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Log in to GitHub Container Registry with GITHUB_TOKEN
        if: ${{ secrets.CR_PAT == '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/sentineliq-api:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Build and push frontend image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/sentineliq-frontend:${{ github.sha }}
          docker build -t $IMAGE frontend/
          docker push $IMAGE

  deploy-frontend-pages:
    runs-on: ubuntu-latest
    needs: build-containers
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1
        with: {}

  deploy:
    runs-on: ubuntu-latest
    needs: build-containers
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to remote server via SSH
        if: secrets.DEPLOY_SSH_PRIVATE_KEY != ''
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository_owner }}/sentineliq-api:${{ github.sha }}
            docker pull ghcr.io/${{ github.repository_owner }}/sentineliq-frontend:${{ github.sha }}
            # Example: update compose and restart (requires remote compose file configured)
            docker-compose -f /opt/sentineliq/docker-compose.yml pull
            docker-compose -f /opt/sentineliq/docker-compose.yml up -d
